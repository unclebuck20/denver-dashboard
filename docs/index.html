<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Denver Neighborhood Sales</title>
<meta name="description" content="Every arm's-length single-family home sale across 17 Denver neighborhoods since 2015, refreshed weekly from City and County of Denver open data.">
<style>
:root {
  color-scheme: light;
  --bg: #f7f7f5; --surface: #fcfcfb; --border: #e4e3de; --grid: #ecebe7;
  --text: #0b0b0b; --text-2: #52514e; --text-3: #75746f; --accent: #2a78d6; --chip: #f0efec;
  --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a;
  --good: #1b7f3b; --bad: #c33a39; --new-bg: #e6f0fc; --new-fg: #1c5cab; --hover: #f0efec;
}
@media (prefers-color-scheme: dark) {
  :root:where(:not([data-theme="light"])) {
    color-scheme: dark;
    --bg: #111110; --surface: #1a1a19; --border: #2e2e2b; --grid: #262624;
    --text: #ffffff; --text-2: #c3c2b7; --text-3: #9a998f; --accent: #3987e5; --chip: #262624;
    --s1: #3987e5; --s2: #d95926; --s3: #199e70;
    --good: #4cc27a; --bad: #e66767; --new-bg: #16325a; --new-fg: #9ec5f4; --hover: #232321;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #111110; --surface: #1a1a19; --border: #2e2e2b; --grid: #262624;
  --text: #ffffff; --text-2: #c3c2b7; --text-3: #9a998f; --accent: #3987e5; --chip: #262624;
  --s1: #3987e5; --s2: #d95926; --s3: #199e70;
  --good: #4cc27a; --bad: #e66767; --new-bg: #16325a; --new-fg: #9ec5f4; --hover: #232321;
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--text);
  font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif;
  -webkit-font-smoothing: antialiased;
}
.wrap { max-width: 1120px; margin: 0 auto; padding: 28px 16px 64px; }
header h1 { font-size: 24px; letter-spacing: -0.01em; margin: 0 0 4px; }
header p { margin: 0; color: var(--text-2); }
.num { font-variant-numeric: tabular-nums; }
button { font: inherit; }
a { color: var(--accent); }

.filters { display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center; margin: 22px 0 16px; }
.seg { display: inline-flex; background: var(--chip); border-radius: 8px; padding: 2px; }
.seg button { border: 0; background: transparent; color: var(--text-2); font-size: 13px; padding: 5px 10px; border-radius: 6px; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--text); box-shadow: 0 0 0 1px var(--border); font-weight: 600; }
.seg button:disabled { opacity: .4; cursor: not-allowed; }
.ctl { display: inline-flex; align-items: center; gap: 8px; color: var(--text-2); font-size: 13px; }
.ctl input[type=range] { width: 130px; accent-color: var(--accent); }
.ctl output { color: var(--text); font-weight: 600; min-width: 64px; }

.card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 18px; }
.stack { display: grid; gap: 16px; }
.stack > * { min-width: 0; }
.tiles { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 16px; }
.tile { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 14px 16px; }
.tile .label { color: var(--text-2); font-size: 12px; }
.tile .value { font-size: 26px; font-weight: 650; letter-spacing: -0.02em; margin-top: 2px; }
.tile .sub { color: var(--text-3); font-size: 12px; }
.up { color: var(--good); } .down { color: var(--bad); }
@media (max-width: 760px) { .tiles { grid-template-columns: repeat(2, 1fr); } }

.cardhead { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-start; gap: 10px; margin-bottom: 10px; }
h2 { font-size: 15px; margin: 0 0 2px; }
.hint { color: var(--text-3); font-size: 12px; margin: 0; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; margin: 0 0 8px; font-size: 12px; color: var(--text-2); min-height: 18px; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i.ln { width: 14px; height: 2px; border-radius: 1px; display: inline-block; }
.legend i.dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }

.chart { position: relative; }
.chart svg { display: block; width: 100%; height: auto; overflow: visible; }
.chart .axis text { fill: var(--text-3); font-size: 11px; }
.chart .gridline { stroke: var(--grid); stroke-width: 1; }
.chart .line { fill: none; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
.chart .halo { fill: none; stroke: var(--surface); stroke-width: 5; stroke-linejoin: round; }
.chart .endlabel { font-size: 11px; fill: var(--text-2); }
.chart .cross { stroke: var(--text-3); stroke-width: 1; stroke-dasharray: 2 3; }
.chart .pt { stroke: var(--surface); stroke-width: 1; }
.chart rect:focus { outline: none; }
.chart rect:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.tip {
  position: absolute; pointer-events: none; background: var(--surface); border: 1px solid var(--border);
  border-radius: 8px; padding: 8px 10px; font-size: 12px; box-shadow: 0 4px 16px rgba(0,0,0,.12);
  min-width: 180px; display: none; z-index: 5;
}
.tip .when { color: var(--text-3); margin-bottom: 4px; }
.tip .big { font-size: 15px; font-weight: 650; }
.tip .row { display: flex; align-items: center; gap: 10px; justify-content: space-between; }
.tip .row b { font-weight: 650; }
.tip .row span { color: var(--text-2); display: inline-flex; align-items: center; gap: 6px; }
.tip .row i { width: 10px; height: 2px; display: inline-block; }

table { width: 100%; border-collapse: collapse; font-size: 13px; }
th { text-align: left; font-weight: 600; color: var(--text-2); font-size: 12px; padding: 6px 8px; border-bottom: 1px solid var(--border); white-space: nowrap; }
th.sortable { cursor: pointer; user-select: none; }
th.r, td.r { text-align: right; }
td { padding: 7px 8px; border-bottom: 1px solid var(--grid); white-space: nowrap; }
tbody tr:hover td { background: var(--hover); }
tr.cluster td { color: var(--text-3); font-size: 11px; text-transform: uppercase; letter-spacing: .06em; padding-top: 12px; border-bottom: 0; background: none !important; }
.cmp { width: 18px; height: 18px; border-radius: 5px; border: 1.5px solid var(--border); background: transparent; padding: 0; cursor: pointer; vertical-align: -4px; }
.cmp[aria-pressed="true"] { border-color: transparent; }
.nblink { background: none; border: 0; padding: 0 0 0 8px; color: var(--text); cursor: pointer; text-align: left; font-weight: 500; }
.nblink:hover { color: var(--accent); text-decoration: underline; }
.nblink .arrow { color: var(--text-3); margin-left: 4px; }
.scroll { overflow-x: auto; }
.badge { background: var(--new-bg); color: var(--new-fg); font-size: 11px; font-weight: 600; padding: 1px 6px; border-radius: 4px; margin-left: 6px; }
.note { color: var(--text-3); font-size: 12px; margin-top: 10px; }
.btn { border: 1px solid var(--border); background: var(--surface); color: var(--text); border-radius: 8px; padding: 6px 12px; font-size: 13px; cursor: pointer; }
.btn:hover { background: var(--hover); }
.linkbtn { background: none; border: 0; color: var(--accent); padding: 0; cursor: pointer; font-size: 13px; }
.back { margin: 18px 0 4px; }
.detailhead h2 { font-size: 22px; letter-spacing: -0.01em; margin: 0; }
.detailhead p { margin: 2px 0 0; color: var(--text-2); }
.toolbar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; margin-bottom: 10px; }
.search { border: 1px solid var(--border); background: var(--surface); color: var(--text); border-radius: 8px; padding: 6px 10px; font: inherit; font-size: 13px; width: 220px; max-width: 100%; }
tr.flash td { background: var(--new-bg) !important; }
details { margin-top: 16px; color: var(--text-2); }
details summary { cursor: pointer; font-weight: 600; color: var(--text); }
details li { margin: 3px 0; }
.warn { border-left: 3px solid #eda100; padding: 8px 12px; background: var(--chip); border-radius: 6px; color: var(--text-2); font-size: 13px; margin-top: 12px; }
[hidden] { display: none !important; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Denver Neighborhood Sales</h1>
    <p id="subtitle">Single-family, arm's-length sales · 17 neighborhoods · since 2015</p>
  </header>

  <div class="filters" role="group" aria-label="Filters">
    <div class="seg" id="range" aria-label="Date range">
      <button data-v="all">Since 2015</button><button data-v="5">5 yr</button><button data-v="3">3 yr</button><button data-v="1">1 yr</button>
    </div>
    <div class="seg" id="metric" aria-label="Measure">
      <button data-v="price">Sale price</button><button data-v="ppsf">$ / sq ft</button>
    </div>
    <div class="seg" id="dollars" aria-label="Dollars">
      <button data-v="nominal">Nominal $</button><button data-v="real">Today's $</button>
    </div>
    <label class="ctl" id="sizectl"><span id="sizelabel">Min above-grade size</span>
      <input type="range" id="minsqft" min="0" max="3000" step="100">
      <output id="minsqftOut" class="num"></output>
    </label>
  </div>

  <!-- Overview -->
  <main id="overview" class="stack">
    <div class="tiles" id="tiles" style="margin:0"></div>
    <section class="card">
      <div class="cardhead">
        <div><h2 id="chartTitle"></h2><p class="hint" id="chartHint"></p></div>
        <div class="seg viewseg" aria-label="Chart view"><button data-v="sales">Every sale</button><button data-v="trend">Trend</button></div>
      </div>
      <div class="legend" id="legend"></div>
      <div class="chart" id="chart"><div class="tip"></div></div>
    </section>
    <section class="card">
      <h2>Neighborhoods</h2>
      <p class="hint" style="margin-bottom:10px">Last 12 months vs. the 12 before. Tick up to 3 boxes to compare on the chart; click a name to see every sale there.</p>
      <div class="scroll"><table id="nbTable"></table></div>
    </section>
    <section class="card">
      <h2>Recent sales</h2>
      <p class="hint" id="recentHint" style="margin-bottom:10px"></p>
      <div class="scroll"><table id="recent"></table></div>
    </section>
  </main>

  <!-- Neighborhood detail -->
  <main id="detail" class="stack" hidden>
    <div>
      <p class="back"><button class="linkbtn" id="backBtn">← All neighborhoods</button></p>
      <div class="detailhead"><h2 id="dName"></h2><p id="dSub"></p></div>
    </div>
    <div class="tiles" id="dTiles" style="margin:0"></div>
    <section class="card">
      <div class="cardhead">
        <div><h2 id="dChartTitle"></h2><p class="hint" id="dChartHint"></p></div>
        <div class="seg viewseg" aria-label="Chart view"><button data-v="sales">Every sale</button><button data-v="trend">Trend</button></div>
      </div>
      <div class="legend" id="dLegend"></div>
      <div class="chart" id="dChart"><div class="tip"></div></div>
    </section>
    <section class="card">
      <div class="toolbar">
        <div><h2 id="dTableTitle">Every sale</h2><p class="hint" id="dTableHint"></p></div>
        <input class="search" id="dSearch" type="search" placeholder="Search address" aria-label="Search address">
      </div>
      <div class="scroll"><table id="dTable"></table></div>
      <p style="text-align:center;margin:14px 0 0"><button class="btn" id="dMore" hidden>Show more</button></p>
    </section>
  </main>

  <details>
    <summary>How the numbers are built</summary>
    <div id="method"></div>
  </details>
</div>

<script>
(async function () {
  const SLOTS = ["--s1", "--s2", "--s3"];
  const MAX_SEL = 3;
  const PAGE = 50;
  const fmt$ = v => v == null || !isFinite(v) ? "–" : "$" + Math.round(v).toLocaleString("en-US");
  const fmtK = v => v == null ? "–" : v >= 1e6 ? "$" + (v / 1e6).toFixed(v >= 1e7 ? 1 : 2) + "M" : "$" + Math.round(v / 1e3) + "K";
  const fmtPct = v => v == null || !isFinite(v) ? "–" : (v > 0 ? "+" : "") + (v * 100).toFixed(1) + "%";
  const fmtD = v => v ? new Date(v + "T12:00").toLocaleDateString("en-US", { month: "short", day: "numeric", year: "numeric" }) : "–";
  const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
  const el = (tag, attrs = {}, text) => { const e = document.createElement(tag); for (const k in attrs) e.setAttribute(k, attrs[k]); if (text != null) e.textContent = text; return e; };
  const NS = "http://www.w3.org/2000/svg";
  const sv = (tag, attrs = {}) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); return e; };
  const median = a => { if (!a.length) return null; const s = [...a].sort((x, y) => x - y); const m = s.length >> 1; return s.length % 2 ? s[m] : (s[m - 1] + s[m]) / 2; };
  const slug = n => n.toLowerCase().replace(/[^a-z0-9]+/g, "-");

  const data = await (await fetch("data.json", { cache: "no-cache" })).json();
  const M = data.meta, ix = Object.fromEntries(M.columns.map((c, i) => [c, i]));
  const NB = M.neighborhoods;
  const nbByName = Object.fromEntries(NB.map((n, i) => [n.name, i]));
  const cpi = data.cpi, cpiKeys = cpi ? Object.keys(cpi).sort() : [];
  const cpiLatest = cpi ? cpi[cpiKeys[cpiKeys.length - 1]] : null;
  const cpiFor = ym => cpi ? (cpi[ym] || cpiLatest) : null;

  const sales = data.sales.map((r, id) => ({
    id, date: r[ix.date], ym: r[ix.date].slice(0, 7), t: Date.parse(r[ix.date] + "T12:00"), nb: r[ix.nbhd], price: r[ix.price], sqft: r[ix.sqft],
    yb: r[ix.year_built], lot: r[ix.lot_sqft], zone: r[ix.zone], addr: r[ix.address], rec: r[ix.recorded],
    beds: ix.beds != null ? r[ix.beds] : null, baths: ix.baths != null ? r[ix.baths] : null,
  }));
  const lastDate = sales.reduce((m, s) => s.date > m ? s.date : m, "0");
  const endYM = lastDate.slice(0, 7);
  const weekAgo = new Date(new Date(M.latest_recorded + "T12:00") - 7 * 864e5).toISOString().slice(0, 10);

  // ---------- state (neighborhoods stored by name so adding neighborhoods never shifts saved picks)
  const state = { range: "all", metric: "price", dollars: "nominal", minSqft: M.default_min_sqft, view: "sales", sel: [], color: {} };
  try { const saved = JSON.parse(localStorage.getItem("dnsd2") || "null"); if (saved) Object.assign(state, saved); } catch (e) {}
  state.sel = state.sel.filter(n => n in nbByName).slice(0, MAX_SEL);
  for (const k of Object.keys(state.color)) if (!state.sel.includes(k) || state.color[k] > 2) delete state.color[k];
  for (const n of state.sel) if (state.color[n] == null) { const used = new Set(Object.values(state.color)); state.color[n] = [0, 1, 2].find(k => !used.has(k)); }
  if (!state.sel.length) { state.sel = ["Washington Park", "West Highland"]; state.color = { "Washington Park": 0, "West Highland": 1 }; }
  if (!cpi) state.dollars = "nominal";
  const save = () => { try { localStorage.setItem("dnsd2", JSON.stringify(state)); } catch (e) {} };
  const detail = { nb: null, sortKey: "date", sortDir: -1, q: "", shown: PAGE, flash: null };

  // ---------- header + controls
  document.getElementById("subtitle").textContent =
    `Single-family, arm's-length sales · ${NB.length} neighborhoods · deeds recorded through ${fmtD(M.latest_recorded)} · refreshed ${new Date(M.built).toLocaleDateString("en-US", { month: "short", day: "numeric" })}`;
  const slider = document.getElementById("minsqft"), out = document.getElementById("minsqftOut");
  if (M.beds_mode === "beds") document.getElementById("sizelabel").textContent = "3+ bed / 2+ bath · min size";
  slider.value = state.minSqft;

  const eligible = s => s.sqft >= state.minSqft && (M.beds_mode !== "beds" || (s.beds >= 3 && s.baths >= 2));
  const dollars = (v, ym) => state.dollars === "real" && cpi ? v * cpiLatest / cpiFor(ym) : v;
  const val = s => state.metric === "ppsf" ? dollars(s.price, s.ym) / s.sqft : dollars(s.price, s.ym);
  const fmtVal = v => state.metric === "ppsf" ? fmt$(v) : fmtK(v);
  const addMonths = (ym, k) => { let [y, m] = ym.split("-").map(Number); m += k; y += Math.floor((m - 1) / 12); m = ((m - 1) % 12 + 12) % 12 + 1; return `${y}-${String(m).padStart(2, "0")}`; };
  const startYM = () => state.range === "all" ? "2015-01" : addMonths(endYM, -12 * Number(state.range) + 1);
  const inRange = s => s.ym >= startYM();

  function bindSeg(root, key, onChange) {
    const paint = () => root.querySelectorAll("button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.v === String(state[key]))));
    root.addEventListener("click", e => { const b = e.target.closest("button"); if (!b || b.disabled) return; state[key] = b.dataset.v; save(); onChange(); });
    return paint;
  }
  const painters = [
    bindSeg(document.getElementById("range"), "range", render),
    bindSeg(document.getElementById("metric"), "metric", render),
    bindSeg(document.getElementById("dollars"), "dollars", render),
    ...[...document.querySelectorAll(".viewseg")].map(r => bindSeg(r, "view", render)),
  ];
  if (!cpi) { const b = document.querySelector('#dollars [data-v="real"]'); b.disabled = true; b.title = "Inflation data unavailable this refresh"; }
  slider.addEventListener("input", () => { state.minSqft = Number(slider.value); save(); render(); });

  // ---------- stats
  const t12 = [addMonths(endYM, -11), endYM], p12 = [addMonths(endYM, -23), addMonths(endYM, -12)], p36 = [addMonths(endYM, -47), addMonths(endYM, -36)];
  function windowStats(nbs, fromYM, toYM) {
    const rows = sales.filter(s => nbs.includes(s.nb) && s.ym >= fromYM && s.ym <= toYM && eligible(s));
    return { n: rows.length, price: median(rows.map(s => dollars(s.price, s.ym))), ppsf: median(rows.map(s => dollars(s.price, s.ym) / s.sqft)),
             lo: rows.length ? Math.min(...rows.map(s => dollars(s.price, s.ym))) : null, hi: rows.length ? Math.max(...rows.map(s => dollars(s.price, s.ym))) : null };
  }
  function renderTiles(box, nbs, label) {
    box.replaceChildren();
    const cur = windowStats(nbs, ...t12), prev = windowStats(nbs, ...p12);
    const chg = (a, b) => a && b ? a / b - 1 : null;
    const nChg = prev.n ? cur.n / prev.n - 1 : null;
    const tiles = [
      ["Sales, last 12 months", cur.n.toLocaleString(), `${fmtPct(nChg)} vs. prior year (${prev.n.toLocaleString()})`, null],
      ["Median sale price", fmtK(cur.price), `range ${fmtK(cur.lo)} – ${fmtK(cur.hi)}`, null],
      ["Median $ / sq ft", fmt$(cur.ppsf), `${fmtPct(chg(cur.ppsf, prev.ppsf))} vs. prior year`, chg(cur.ppsf, prev.ppsf)],
      ["Newest sale recorded", (() => { const s = sales.filter(s => nbs.includes(s.nb) && eligible(s)).sort((a, b) => (b.rec || b.date).localeCompare(a.rec || a.date))[0]; return s ? fmtK(s.price) : "–"; })(),
        (() => { const s = sales.filter(s => nbs.includes(s.nb) && eligible(s)).sort((a, b) => (b.rec || b.date).localeCompare(a.rec || a.date))[0]; return s ? `${s.addr} · ${fmtD(s.rec || s.date)}` : ""; })(), null],
    ];
    for (const [lab, value, sub, sign] of tiles) {
      const t = el("div", { class: "tile" });
      t.append(el("div", { class: "label" }, lab), el("div", { class: "value num" }, value));
      const subEl = el("div", { class: "sub" + (sign == null ? "" : sign > 0 ? " up" : sign < 0 ? " down" : "") }, sub);
      t.append(subEl); box.append(t);
    }
    if (label) box.firstChild.querySelector(".label").textContent = `Sales, last 12 months · ${label}`;
  }

  // ---------- chart (shared by overview and detail)
  function trendSeries(nb) {
    const byMonth = new Map();
    for (const s of sales) if (s.nb === nb && eligible(s)) { if (!byMonth.has(s.ym)) byMonth.set(s.ym, []); byMonth.get(s.ym).push(val(s)); }
    const pts = [];
    for (let ym = startYM(); ym <= endYM; ym = addMonths(ym, 1)) {
      const pool = [...(byMonth.get(addMonths(ym, -2)) || []), ...(byMonth.get(addMonths(ym, -1)) || []), ...(byMonth.get(ym) || [])];
      pts.push({ ym, t: Date.parse(ym + "-15T12:00"), v: pool.length >= 5 ? median(pool) : null, n: pool.length });
    }
    return pts;
  }
  function niceStep(raw) { const p = Math.pow(10, Math.floor(Math.log10(raw))); const f = raw / p; return (f <= 1 ? 1 : f <= 2 ? 2 : f <= 2.5 ? 2.5 : f <= 5 ? 5 : 10) * p; }
  function quantile(a, q) { if (!a.length) return 0; const s = [...a].sort((x, y) => x - y); return s[Math.min(s.length - 1, Math.floor(q * s.length))]; }

  function renderChart(box, legend, titleEl, hintEl, series, onPick) {
    // series: [{nb, color}]
    const tip = box.querySelector(".tip");
    box.querySelectorAll("svg").forEach(n => n.remove()); tip.style.display = "none";
    const measure = state.metric === "ppsf" ? "$ / sq ft" : "Sale price";
    const real = state.dollars === "real" ? " (today's dollars)" : "";
    legend.replaceChildren();
    if (!series.length) { titleEl.textContent = measure; hintEl.textContent = ""; legend.append(el("span", {}, "Tick a neighborhood in the table below to chart it.")); return; }

    const t0 = Date.parse(startYM() + "-01T00:00"), t1 = Date.parse(addMonths(endYM, 1) + "-01T00:00");
    const lines = series.map(s => ({ ...s, pts: trendSeries(s.nb) }));
    const dots = state.view === "sales" ? sales.filter(s => series.some(x => x.nb === s.nb) && eligible(s) && inRange(s)).map(s => ({ s, v: val(s), color: series.find(x => x.nb === s.nb).color })) : [];

    if (state.view === "sales") {
      titleEl.textContent = `Every sale · ${measure}${real}`;
      hintEl.textContent = `${dots.length.toLocaleString()} sales, one dot each. The line is the rolling 3-month median. Hover a dot for the address${onPick ? "; click it to find it in the table" : ""}.`;
    } else {

    }
    for (const l of lines) {
      const sp = el("span"); const i = el("i", { class: state.view === "sales" ? "dot" : "ln" }); i.style.background = l.color;
      sp.append(i, document.createTextNode(NB[l.nb].name)); legend.append(sp);
    }

    const W = Math.max(320, box.clientWidth), narrow = W < 560;
    const H = narrow ? 260 : (state.view === "sales" ? 380 : 300);
    const m = { t: 10, r: narrow || lines.length < 2 ? 14 : 124, b: 26, l: 58 };
    const lineVals = lines.flatMap(l => l.pts.map(p => p.v).filter(v => v != null));
    const dotVals = dots.map(d => d.v);
    let lo, hi, capped = null;
    if (state.view === "sales" && dotVals.length) {

    const x = t => m.l + (t - t0) / (t1 - t0) * (W - m.l - m.r);

    const svg = sv("svg", { viewBox: `0 0 ${W} ${H}`, role: "img", "aria-label": titleEl.textContent + ". Individual values are listed in the table below." });
    const axis = sv("g", { class: "axis" }); svg.append(axis);
    for (let v = lo; v <= hi + 1e-9; v += step) {
      axis.append(sv("line", { class: "gridline", x1: m.l, x2: W - m.r, y1: y(v), y2: y(v) }));
      const t = sv("text", { x: m.l - 8, y: y(v) + 4, "text-anchor": "end" }); t.textContent = state.metric === "ppsf" ? "$" + Math.round(v).toLocaleString() : fmtK(v); axis.append(t);
    }

    if (state.range === "1") {
      for (let k = 0; k < 12; k += 2) { const ym = addMonths(startYM(), k), tt = Date.parse(ym + "-01T12:00"); const t = sv("text", { x: x(tt), y: H - 6, "text-anchor": "middle" }); t.textContent = new Date(tt).toLocaleDateString("en-US", { month: "short", year: "2-digit" }); axis.append(t); }
    } else for (let yr = y0; yr <= y1; yr++) {
      const tt = Date.parse(yr + "-01-01T12:00"); if (tt < t0 || tt > t1 || (yr - y0) % every) continue;
      const t = sv("text", { x: x(tt), y: H - 6, "text-anchor": "middle" }); t.textContent = yr; axis.append(t);
    }

    // dots

    const op = dots.length > 1500 ? 0.45 : dots.length > 400 ? 0.6 : 0.8;

      else gd.append(sv("circle", { class: "pt", cx: d.cx, cy: d.cy, r, fill: d.color, "fill-opacity": op, "stroke-width": dots.length > 1500 ? 0 : 1 }));
    }
    // median lines (with halo so they read over the dots)
    const gl = sv("g"); svg.append(gl);
    const labels = [];
    for (const l of lines) {
      let d = "", pen = false;
      l.pts.forEach(p => { if (p.v == null) { pen = false; return; } d += (pen ? "L" : "M") + x(p.t).toFixed(1) + "," + y(p.v).toFixed(1); pen = true; });
      if (state.view === "sales") gl.append(sv("path", { class: "halo", d }));
      gl.append(sv("path", { class: "line", d, stroke: l.color }));
      const last = [...l.pts].reverse().find(p => p.v != null);
      if (last && m.r > 60) labels.push({ y: y(last.v), x: x(last.t), text: NB[l.nb].name });
    }
    labels.sort((a, b) => a.y - b.y); for (let i = 1; i < labels.length; i++) labels[i].y = Math.max(labels[i].y, labels[i - 1].y + 14);
    for (const lb of labels) { const t = sv("text", { class: "endlabel", x: lb.x + 8, y: lb.y + 4 }); t.textContent = lb.text; gl.append(t); }
    if (capped) { const t = sv("text", { x: W - m.r, y: m.t - 1, "text-anchor": "end", class: "endlabel" }); t.textContent = `▲ above ${fmtVal(capped)}`; axis.append(t); }

    // hover layer
    const cross = sv("line", { class: "cross", y1: m.t, y2: H - m.b }); cross.style.display = "none"; svg.append(cross);
    const ring = sv("circle", { r: 7, fill: "none", "stroke-width": 2 }); ring.style.display = "none"; svg.append(ring);
    const hdots = lines.map(l => { const c = sv("circle", { r: 4, fill: l.color, stroke: css("--surface"), "stroke-width": 2 }); c.style.display = "none"; svg.append(c); return c; });
    const hit = sv("rect", { x: m.l - 6, y: 0, width: W - m.l - m.r + 12, height: H, fill: "transparent", tabindex: "0" }); svg.append(hit);
    box.insertBefore(svg, tip);

    const place = (px, py) => { const sc = box.clientWidth / W; tip.style.display = "block"; const tw = tip.offsetWidth, th = tip.offsetHeight; let L = px * sc + 14; if (L + tw > box.clientWidth) L = px * sc - tw - 14; tip.style.left = Math.max(0, L) + "px"; tip.style.top = Math.max(0, Math.min(py * sc - th / 2, box.clientHeight - th)) + "px"; };
    const hide = () => { tip.style.display = "none"; cross.style.display = "none"; ring.style.display = "none"; hdots.forEach(d => d.style.display = "none"); };
    let current = null, focusK = 0;

    function showSale(d) {
      current = d; ring.style.display = ""; ring.setAttribute("cx", d.cx); ring.setAttribute("cy", Math.max(d.cy, m.t + 3)); ring.setAttribute("stroke", d.color);
      const s = d.s;
      tip.replaceChildren(el("div", { class: "when" }, `${fmtD(s.date)} · ${NB[s.nb].name}`), el("div", { class: "big num" }, fmt$(dollars(s.price, s.ym))));
      const rows = [["Address", s.addr], ["$ / sq ft", fmt$(dollars(s.price, s.ym) / s.sqft)], ["Size", s.sqft.toLocaleString() + " sq ft"], ["Built", String(s.yb)], ["Lot", s.lot ? s.lot.toLocaleString() + " sq ft" : "–"]];
      if (s.beds != null) rows.splice(3, 0, ["Beds / baths", `${s.beds} / ${s.baths}`]);
      for (const [k, v] of rows) { const row = el("div", { class: "row" }); row.append(el("span", {}, k), el("b", { class: "num" }, v)); tip.append(row); }
      place(d.cx, d.cy);
    }
    function showMonth(t) {
      const idx = Math.max(0, Math.min(lines[0].pts.length - 1, Math.round((t - lines[0].pts[0].t) / (30.44 * 864e5))));
      const p0 = lines[0].pts[idx]; if (!p0) return;
      cross.setAttribute("x1", x(p0.t)); cross.setAttribute("x2", x(p0.t)); cross.style.display = "";
      tip.replaceChildren(el("div", { class: "when" }, new Date(p0.t).toLocaleDateString("en-US", { month: "long", year: "numeric" }) + " · 3-month window"));
      lines.forEach((l, k) => {
        const p = l.pts[idx];
        if (p.v == null) hdots[k].style.display = "none"; else { hdots[k].style.display = ""; hdots[k].setAttribute("cx", x(p.t)); hdots[k].setAttribute("cy", y(p.v)); }
        const row = el("div", { class: "row" }), name = el("span"), key = el("i"); key.style.background = l.color;
        name.append(key, document.createTextNode(`${NB[l.nb].name} (${p.n} sales)`));
        row.append(name, el("b", { class: "num" }, p.v == null ? "too few" : fmtVal(p.v))); tip.append(row);
      });
      place(x(p0.t), m.t + 40);
    }
    const toLocal = e => { const b = svg.getBoundingClientRect(); return [(e.clientX - b.left) * W / b.width, (e.clientY - b.top) * H / b.height]; };
    hit.addEventListener("pointermove", e => {
      const [px, py] = toLocal(e);

        let best = null, bd = 18 * 18;
        for (const d of dots) { const dx = d.cx - px, dy = Math.max(d.cy, m.t + 3) - py, dd = dx * dx + dy * dy; if (dd < bd) { bd = dd; best = d; } }

    });
  }

  // ---------- neighborhood table (overview)
  let nbSort = null, nbDir = -1;
  function toggleCompare(name) {
    if (state.sel.includes(name)) { state.sel = state.sel.filter(x => x !== name); delete state.color[name]; }
    else {
      if (state.sel.length >= MAX_SEL) { const h = document.getElementById("chartHint"); h.textContent = "The chart compares up to 3 neighborhoods. Untick one first."; return; }
      const used = new Set(Object.values(state.color)); state.color[name] = [0, 1, 2].find(k => !used.has(k)); state.sel.push(name);
    }
    save(); render();
  }
  function renderNbTable() {
    const t = document.getElementById("nbTable"); t.replaceChildren();
    const cols = [["", null], ["Neighborhood", "name"], ["Sales", "n", 1], ["Median price", "price", 1], ["$ / sq ft", "ppsf", 1], ["1-yr", "yoy", 1], ["3-yr", "y3", 1]];
    const head = el("thead"), hr = el("tr");
    cols.forEach(([label, key, r]) => {
      const th = el("th", { class: (r ? "r " : "") + (key ? "sortable" : ""), scope: "col" }, label + (nbSort === key && key ? (nbDir < 0 ? " ↓" : " ↑") : ""));
      if (key) th.addEventListener("click", () => { nbDir = nbSort === key ? -nbDir : -1; nbSort = key; renderNbTable(); });
      hr.append(th);
    });
    head.append(hr); t.append(head);
    const rows = NB.map((nb, i) => {
      const c = windowStats([i], ...t12), p = windowStats([i], ...p12), p3 = windowStats([i], ...p36);
      return { i, name: nb.name, cluster: nb.cluster, n: c.n, price: c.price, ppsf: c.ppsf,
               yoy: c.ppsf && p.ppsf && c.n >= 8 && p.n >= 8 ? c.ppsf / p.ppsf - 1 : null,
               y3: c.ppsf && p3.ppsf && c.n >= 8 && p3.n >= 8 ? c.ppsf / p3.ppsf - 1 : null };
    });

    const groups = nbSort ? [["", [...rows].sort((a, b) => { const A = a[nbSort], B = b[nbSort]; if (A == null) return 1; if (B == null) return -1; return (A > B ? 1 : A < B ? -1 : 0) * nbDir; })]]
                          : clusters.map(c => [c, rows.filter(r => r.cluster === c)]);

    for (const [label, list] of groups) {
      if (label) { const tr = el("tr", { class: "cluster" }); tr.append(el("td", { colspan: 7 }, label)); body.append(tr); }
      for (const r of list) {
        const on = state.sel.includes(r.name);
        const tr = el("tr");
        const cb = el("button", { class: "cmp", "aria-pressed": String(on), "aria-label": `Compare ${r.name} on the chart`, title: "Compare on chart" });
        if (on) cb.style.background = css(SLOTS[state.color[r.name]]);
        cb.addEventListener("click", () => toggleCompare(r.name));
        const td0 = el("td"); td0.style.width = "28px"; td0.append(cb);
        const link = el("button", { class: "nblink" }); link.append(document.createTextNode(r.name), el("span", { class: "arrow" }, "›"));
        link.addEventListener("click", () => openDetail(r.i));
        const td1 = el("td"); td1.style.paddingLeft = "0"; td1.append(link);
        tr.append(td0, td1, el("td", { class: "r num" }, r.n.toLocaleString()), el("td", { class: "r num" }, fmtK(r.price)), el("td", { class: "r num" }, fmt$(r.ppsf)));
        for (const v of [r.yoy, r.y3]) tr.append(el("td", { class: "r num " + (v > 0 ? "up" : v < 0 ? "down" : "") }, fmtPct(v)));
        body.append(tr);
      }
    }
    t.append(body);
  }

  // ---------- sales tables
  const saleCols = () => {
    const c = [["Sold", "date"], ["Recorded", "rec"], ["Address", "addr"]];

  }

  function detailRows() {
    const q = detail.q.trim().toLowerCase();
    const rows = sales.filter(s => s.nb === detail.nb && eligible(s) && inRange(s) && (!q || s.addr.toLowerCase().includes(q)));
    const k = detail.sortKey, dir = detail.sortDir;

    rows.sort((a, b) => { const A = key(a), B = key(b); if (A == null) return 1; if (B == null) return -1; return (A > B ? 1 : A < B ? -1 : 0) * dir; });

  route();
  let rt; window.addEventListener("resize", () => { clearTimeout(rt); rt = setTimeout(render, 150); });
  window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", render);
})();
</script>
