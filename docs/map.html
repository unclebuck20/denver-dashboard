<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Denver Sales Map</title>
<meta name="description" content="Map of every Denver single-family home sale since 2015 across 17 neighborhoods, one pin per home at its latest sale.">
<link rel="stylesheet" href="vendor/maplibre-gl.css">
<style>
:root {
  color-scheme: light;
  --bg: #f7f7f5; --surface: #ffffff; --border: #e4e3de; --grid: #ecebe7;
  --text: #0b0b0b; --text-2: #52514e; --text-3: #75746f; --accent: #2a78d6; --chip: #f0efec; --hover: #f4f6fa;
  --c1: #86b6ef; --c2: #5598e7; --c3: #2a78d6; --c4: #1c5cab; --c5: #0d366b;
  --hl: #eb6834;
}
@media (prefers-color-scheme: dark) {
  :root:where(:not([data-theme="light"])) {
    color-scheme: dark;
    --bg: #111110; --surface: #1a1a19; --border: #2e2e2b; --grid: #262624;
    --text: #ffffff; --text-2: #c3c2b7; --text-3: #9a998f; --accent: #3987e5; --chip: #262624; --hover: #20232a;
    --c1: #184f95; --c2: #256abf; --c3: #3987e5; --c4: #6da7ec; --c5: #b7d3f6;
    --hl: #d95926;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #111110; --surface: #1a1a19; --border: #2e2e2b; --grid: #262624;
  --text: #ffffff; --text-2: #c3c2b7; --text-3: #9a998f; --accent: #3987e5; --chip: #262624; --hover: #20232a;
  --c1: #184f95; --c2: #256abf; --c3: #3987e5; --c4: #6da7ec; --c5: #b7d3f6;
  --hl: #d95926;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif; -webkit-font-smoothing: antialiased; display: flex; flex-direction: column; overflow: hidden; }
button, select { font: inherit; }
a { color: var(--accent); }
.num { font-variant-numeric: tabular-nums; }

.top { display: flex; align-items: center; gap: 14px; padding: 10px 16px; background: var(--surface); border-bottom: 1px solid var(--border); }
.top a.back { text-decoration: none; font-size: 13px; }
.top h1 { font-size: 17px; margin: 0; letter-spacing: -0.01em; }
.top .count { margin-left: auto; color: var(--text-2); font-size: 13px; }

.filters { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; padding: 8px 16px; background: var(--surface); border-bottom: 1px solid var(--border); }
.seg { display: inline-flex; background: var(--chip); border-radius: 8px; padding: 2px; }
.seg button { border: 0; background: transparent; color: var(--text-2); font-size: 13px; padding: 4px 9px; border-radius: 6px; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--text); box-shadow: 0 0 0 1px var(--border); font-weight: 600; }
.ctl { display: inline-flex; align-items: center; gap: 8px; color: var(--text-2); font-size: 13px; }
.ctl output { color: var(--text); font-weight: 600; min-width: 56px; }
.ctl select { background: var(--surface); color: var(--text); border: 1px solid var(--border); border-radius: 8px; padding: 4px 8px; font-size: 13px; }
.ctl > input[type=range] { width: 120px; -webkit-appearance: none; appearance: none; height: 4px; border-radius: 2px; background: var(--border); margin: 0 4px; }
.ctl > input[type=range]::-webkit-slider-thumb, .dual input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 16px; height: 16px; border-radius: 50%; background: var(--accent); border: 2px solid var(--surface); box-shadow: 0 0 0 1px var(--accent); cursor: pointer; pointer-events: auto; position: relative; z-index: 2; }
.ctl > input[type=range]::-moz-range-thumb, .dual input[type=range]::-moz-range-thumb { width: 14px; height: 14px; border-radius: 50%; background: var(--accent); border: 2px solid var(--surface); box-shadow: 0 0 0 1px var(--accent); cursor: pointer; pointer-events: auto; }
.dual { position: relative; width: 150px; height: 20px; margin: 0 4px; }
.dual input[type=range] { position: absolute; left: 0; top: 0; width: 100%; margin: 0; pointer-events: none; background: none; -webkit-appearance: none; appearance: none; height: 20px; }
.dual input[type=range]::-webkit-slider-runnable-track { background: none; }
.dual input[type=range]::-moz-range-track { background: none; }
.dual .track { position: absolute; left: 0; right: 0; top: 8px; height: 4px; border-radius: 2px; background: var(--border); }
.dual .fill { position: absolute; top: 8px; height: 4px; border-radius: 2px; background: var(--accent); }
.info { cursor: help; border-bottom: 1px dotted var(--text-3); }

.body { flex: 1; display: flex; min-height: 0; }
#map { flex: 1; min-width: 0; position: relative; }
.panel { width: 400px; flex: none; display: flex; flex-direction: column; background: var(--bg); border-left: 1px solid var(--border); min-height: 0; }
.panelhead { display: flex; justify-content: space-between; align-items: center; padding: 10px 14px; border-bottom: 1px solid var(--border); background: var(--surface); }
.panelhead h2 { font-size: 14px; margin: 0; }
.panelhead p { margin: 0; color: var(--text-3); font-size: 12px; }
.list { overflow-y: auto; padding: 10px; display: grid; gap: 8px; align-content: start; flex: 1; }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 11px 13px; cursor: pointer; display: grid; grid-template-columns: 6px 1fr; gap: 0 12px; }
.card:hover, .card.hl { border-color: var(--accent); background: var(--hover); }
.card .bar { border-radius: 3px; grid-row: 1 / span 4; }
.card .price { font-size: 19px; font-weight: 700; letter-spacing: -0.01em; display: flex; align-items: baseline; gap: 8px; }
.card .price small { font-size: 12px; font-weight: 500; color: var(--text-3); letter-spacing: 0; }
.card .facts { font-size: 13px; color: var(--text); }
.card .facts b { font-weight: 650; }
.card .facts span.sep { color: var(--text-3); margin: 0 6px; }
.card .addr { font-size: 13px; color: var(--text-2); }
.card .meta { font-size: 12px; color: var(--text-3); }
.more { text-align: center; padding: 6px 0 14px; }
.btn { border: 1px solid var(--border); background: var(--surface); color: var(--text); border-radius: 8px; padding: 6px 12px; font-size: 13px; cursor: pointer; }
.empty { color: var(--text-3); text-align: center; padding: 30px 10px; }

/* pins */
.pin { font: 600 12px/1 -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif; padding: 5px 7px; border-radius: 12px; color: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.35); border: 1.5px solid #fff; cursor: pointer; white-space: nowrap; transform-origin: 50% 100%; }
.pin.light { color: #0b0b0b; }
.pin.hl { background: var(--hl) !important; color: #fff; z-index: 5; transform: scale(1.12); }
.nblabel { font: 600 11px/1.2 -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, sans-serif; color: #1c1c1c; text-transform: uppercase; letter-spacing: .08em; text-shadow: 0 0 3px #fff, 0 0 3px #fff, 0 0 3px #fff; pointer-events: none; text-align: center; }
.sat .nblabel, .dark .nblabel { color: #fff; text-shadow: 0 0 3px #000, 0 0 3px #000, 0 0 3px #000; }

.legend { position: absolute; left: 10px; bottom: 28px; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 7px 10px; font-size: 12px; color: var(--text-2); z-index: 2; box-shadow: 0 1px 4px rgba(0,0,0,.12); }
.legend .row { display: flex; align-items: center; gap: 7px; margin: 2px 0; }
.legend i { width: 10px; height: 10px; border-radius: 50%; display: inline-block; border: 1px solid #fff; box-shadow: 0 0 0 1px rgba(0,0,0,.15); }
.legend .title { font-weight: 600; color: var(--text); margin-bottom: 3px; }

.maplibregl-popup-content { background: var(--surface); color: var(--text); border-radius: 12px; padding: 14px 16px 12px; box-shadow: 0 6px 24px rgba(0,0,0,.22); min-width: 260px; max-width: 320px; }
.maplibregl-popup-close-button { font-size: 20px; color: var(--text-3); right: 6px; top: 4px; }
.maplibregl-popup-anchor-top .maplibregl-popup-tip { border-bottom-color: var(--surface); }
.maplibregl-popup-anchor-bottom .maplibregl-popup-tip { border-top-color: var(--surface); }
.maplibregl-popup-anchor-left .maplibregl-popup-tip { border-right-color: var(--surface); }
.maplibregl-popup-anchor-right .maplibregl-popup-tip { border-left-color: var(--surface); }
.pop .p { font-size: 22px; font-weight: 700; letter-spacing: -0.01em; }
.pop .d { color: var(--text-3); font-size: 12px; margin-bottom: 6px; }
.pop .facts { font-size: 13px; margin-bottom: 2px; }
.pop .addr { font-size: 13px; color: var(--text-2); margin-bottom: 8px; }
.pop dl { display: grid; grid-template-columns: auto 1fr; gap: 2px 12px; font-size: 12px; margin: 0 0 8px; }
.pop dt { color: var(--text-3); } .pop dd { margin: 0; text-align: right; }
.pop h4 { font-size: 12px; margin: 8px 0 4px; color: var(--text-2); text-transform: uppercase; letter-spacing: .06em; }
.pop table { width: 100%; border-collapse: collapse; font-size: 12px; }
.pop td { padding: 3px 0; border-top: 1px solid var(--grid); }
.pop td.r { text-align: right; }
.pop .z { display: inline-block; margin-top: 10px; font-weight: 600; font-size: 13px; text-decoration: none; }
.up { color: #1b7f3b; } .down { color: #c33a39; }

.mobilebar { display: none; }
.filtbtn { display: none; margin-left: auto; }
@media (max-width: 820px) {
  .panel { position: absolute; inset: 0; width: auto; z-index: 3; border-left: 0; }
  .body { position: relative; }
  body.showmap .panel { display: none; }
  body:not(.showmap) #map .legend { display: none; }
  .mobilebar { display: block; position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%); z-index: 10; }
  .mobilebar button { border: 0; border-radius: 20px; padding: 9px 18px; background: var(--text); color: var(--bg); font-weight: 600; box-shadow: 0 3px 12px rgba(0,0,0,.25); }
  .top .count { display: none; }
  .filtbtn { display: inline-block; }
  .filters { display: none; }
  body.filtopen .filters { display: flex; }
}
</style>
</head>
<body class="showmap">
  <div class="top">
    <a class="back" href="./">← Dashboard</a>
    <h1>Denver Sales Map</h1>
    <span class="count num" id="count"></span>
    <button class="btn filtbtn" id="filtBtn" aria-expanded="false" aria-controls="filters">Filters</button>
  </div>
  <div class="filters" id="filters" role="group" aria-label="Filters">
    <div class="seg" id="range" aria-label="Sold within"><button data-v="all">Since 2015</button><button data-v="5">5 yr</button><button data-v="3">3 yr</button><button data-v="1">1 yr</button></div>
    <div class="seg" id="homes" aria-label="Homes" hidden><button data-v="32">3+ bd / 2+ ba</button><button data-v="all">All homes</button></div>
    <div class="ctl" role="group" aria-label="Sale price range"><span>Price</span>
      <div class="dual"><div class="track"></div><div class="fill" id="priceFill"></div>
        <input type="range" id="priceLo" min="0" max="5000000" step="50000" aria-label="Minimum sale price">
        <input type="range" id="priceHi" min="0" max="5000000" step="50000" aria-label="Maximum sale price">
      </div><output id="priceOut" class="num"></output>
    </div>
    <label class="ctl"><span class="info" title="Finished square feet above ground. Denver's assessor doesn't count basements.">Min size</span>
      <input type="range" id="minsqft" min="0" max="3000" step="100"><output id="minsqftOut" class="num"></output></label>
    <label class="ctl">Neighborhood <select id="nb"></select></label>
    <div class="seg" id="color" aria-label="Color pins by"><button data-v="price">Color: price</button><button data-v="age">Sold date</button></div>
    <div class="seg" id="base" aria-label="Base map"><button data-v="map">Map</button><button data-v="sat">Satellite</button></div>
  </div>
  <div class="body">
    <div id="map"><div class="legend" id="legend"></div></div>
    <aside class="panel" aria-label="Homes in view">
      <div class="panelhead">
        <div><h2 id="listTitle">Homes in view</h2><p id="listSub"></p></div>
        <label class="ctl"><select id="sort" aria-label="Sort">
          <option value="new">Newest sale</option><option value="hi">Price (high)</option><option value="lo">Price (low)</option><option value="ppsf">$ / sq ft (high)</option><option value="size">Size (large)</option>
        </select></label>
      </div>
      <div class="list" id="list"></div>
    </aside>
  </div>
  <div class="mobilebar"><button id="toggleView">List</button></div>

<script src="vendor/maplibre-gl.js"></script>
<script>
(async function () {
  const PRICE_CAP = 5000000, PAGE = 60, PIN_ZOOM = 14.5, MAX_PINS = 450;
  const el = (tag, attrs = {}, text) => { const e = document.createElement(tag); for (const k in attrs) e.setAttribute(k, attrs[k]); if (text != null) e.textContent = text; return e; };
  const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
  const fmt$ = v => v == null ? "–" : "$" + Math.round(v).toLocaleString("en-US");
  const fmtK = v => v == null ? "–" : v >= 1e6 ? "$" + (v / 1e6).toFixed(v >= 1e7 ? 1 : 2) + "M" : "$" + Math.round(v / 1e3) + "K";
  const pinK = v => v >= 1e6 ? "$" + (v / 1e6).toFixed(v >= 1e7 ? 0 : 2).replace(/0$/, "") + "M" : "$" + Math.round(v / 1e3) + "K";
  const fmtD = v => v ? new Date(v + "T12:00").toLocaleDateString("en-US", { month: "short", day: "numeric", year: "numeric" }) : "–";
  const slug = n => n.toLowerCase().replace(/[^a-z0-9]+/g, "-");
  const dark = () => matchMedia("(prefers-color-scheme: dark)").matches;

  const [data, bounds] = await Promise.all([
    fetch("data.json", { cache: "no-cache" }).then(r => r.json()),
    fetch("neighborhoods.geojson", { cache: "no-cache" }).then(r => r.ok ? r.json() : null).catch(() => null),
  ]);
  const M = data.meta, ix = Object.fromEntries(M.columns.map((c, i) => [c, i]));
  const NB = M.neighborhoods;
  if (ix.lat == null) { document.getElementById("list").append(el("p", { class: "empty" }, "Map data is still building. Check back after the next refresh.")); return; }
  const sales = data.sales.map((r, id) => ({
    id, date: r[ix.date], ym: r[ix.date].slice(0, 7), nb: r[ix.nbhd], price: r[ix.price], sqft: r[ix.sqft], yb: r[ix.year_built], lot: r[ix.lot_sqft],
    zone: r[ix.zone], addr: r[ix.address], rec: r[ix.recorded], beds: ix.beds != null ? r[ix.beds] : null, baths: ix.baths != null ? r[ix.baths] : null,
    zip: r[ix.zip] || "", pid: r[ix.pid], lat: r[ix.lat], lon: r[ix.lon],
  })).filter(s => s.lat != null);
  const byHome = new Map(); for (const s of sales) { if (!byHome.has(s.pid)) byHome.set(s.pid, []); byHome.get(s.pid).push(s); }
  for (const h of byHome.values()) h.sort((a, b) => b.date.localeCompare(a.date));
  const lastDate = sales.reduce((m, s) => s.date > m ? s.date : m, "0"), endYM = lastDate.slice(0, 7);
  const zillow = s => "https://www.zillow.com/homes/" + encodeURIComponent(`${s.addr}, Denver, CO${s.zip ? " " + s.zip : ""}`.replace(/,/g, "").replace(/\s+/g, "-")).replace(/%2D/g, "-") + "_rb/";

  // ---------- state (shared filter keys with the dashboard)
  const state = { range: "all", homes: "32", minSqft: M.default_min_sqft, priceLo: 0, priceHi: PRICE_CAP, mapColor: "price", mapBase: "map", mapNb: "", mapSort: "new", mode: M.beds_mode };
  try { const saved = JSON.parse(localStorage.getItem("dnsd2") || "null"); if (saved) for (const k of Object.keys(state)) if (k in saved) state[k] = saved[k]; } catch (e) {}
  if (state.mode !== M.beds_mode) { state.minSqft = M.default_min_sqft; state.homes = "32"; state.mode = M.beds_mode; }
  const save = () => { try { const cur = JSON.parse(localStorage.getItem("dnsd2") || "{}"); localStorage.setItem("dnsd2", JSON.stringify({ ...cur, ...state })); } catch (e) {} };
  const hashNb = (location.hash.match(/n=([a-z0-9-]+)/) || [])[1];
  if (hashNb) { const i = NB.findIndex(n => slug(n.name) === hashNb); state.mapNb = i >= 0 ? String(i) : ""; }

  const addMonths = (ym, k) => { let [y, m] = ym.split("-").map(Number); m += k; y += Math.floor((m - 1) / 12); m = ((m - 1) % 12 + 12) % 12 + 1; return `${y}-${String(m).padStart(2, "0")}`; };
  const startYM = () => state.range === "all" ? "2015-01" : addMonths(endYM, -12 * Number(state.range) + 1);
  const eligible = s => s.ym >= startYM() && s.sqft >= state.minSqft && s.price >= state.priceLo && (state.priceHi >= PRICE_CAP || s.price <= state.priceHi)
    && (M.beds_mode !== "beds" || state.homes === "all" || (s.beds >= 3 && s.baths >= 2)) && (state.mapNb === "" || s.nb === Number(state.mapNb));

  // ---------- colors
  const PRICE_BREAKS = [750000, 1000000, 1500000, 2500000];
  const PRICE_LABELS = ["Under $750K", "$750K – $1M", "$1M – $1.5M", "$1.5M – $2.5M", "$2.5M+"];
  const AGE_LABELS = ["Last 12 months", "1–3 years ago", "3–5 years ago", "5+ years ago"];
  const monthsAgo = s => { const [y1, m1] = endYM.split("-").map(Number), [y0, m0] = s.ym.split("-").map(Number); return (y1 - y0) * 12 + (m1 - m0); };
  const colorClass = s => {
    if (state.mapColor === "age") { const a = monthsAgo(s); return a < 12 ? 4 : a < 36 ? 3 : a < 60 ? 1 : 0; }
    let k = 0; while (k < PRICE_BREAKS.length && s.price >= PRICE_BREAKS[k]) k++; return k;
  };
  const RAMP = () => ["--c1", "--c2", "--c3", "--c4", "--c5"].map(css);
  const lightText = k => dark() ? k >= 3 : k <= 1;

  // ---------- controls
  function bindSeg(id, key, onChange) {
    const root = document.getElementById(id);
    const paint = () => root.querySelectorAll("button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.v === String(state[key]))));
    root.addEventListener("click", e => { const b = e.target.closest("button"); if (!b) return; state[key] = b.dataset.v; paint(); save(); onChange(); });
    paint();
  }
  if (M.beds_mode === "beds") document.getElementById("homes").hidden = false;
  bindSeg("range", "range", update); bindSeg("homes", "homes", update); bindSeg("color", "mapColor", update);
  bindSeg("base", "mapBase", setBase);
  const slider = document.getElementById("minsqft"), sOut = document.getElementById("minsqftOut");
  const pLo = document.getElementById("priceLo"), pHi = document.getElementById("priceHi"), pOut = document.getElementById("priceOut");
  slider.value = state.minSqft; pLo.value = state.priceLo; pHi.value = state.priceHi;
  function paintSliders() {
    sOut.textContent = state.minSqft ? state.minSqft.toLocaleString() + "+ sq ft" : "Any";
    const pct = state.minSqft / 3000 * 100; slider.style.background = `linear-gradient(to right, ${css("--border")} ${pct}%, ${css("--accent")} ${pct}%)`;
    const f = document.getElementById("priceFill"); f.style.left = (state.priceLo / PRICE_CAP * 100) + "%"; f.style.right = (100 - state.priceHi / PRICE_CAP * 100) + "%";
    const any = state.priceLo === 0 && state.priceHi >= PRICE_CAP;
    pOut.textContent = any ? "Any" : state.priceLo === 0 ? `Up to ${fmtK(state.priceHi)}` : state.priceHi >= PRICE_CAP ? `${fmtK(state.priceLo)}+` : `${fmtK(state.priceLo)} – ${fmtK(state.priceHi)}`;
    pLo.style.zIndex = state.priceLo > PRICE_CAP * 0.9 ? 3 : 1;
  }
  let t; const later = () => { paintSliders(); save(); clearTimeout(t); t = setTimeout(update, 80); };
  slider.addEventListener("input", () => { state.minSqft = Number(slider.value); later(); });
  pLo.addEventListener("input", () => { state.priceLo = Math.min(Number(pLo.value), state.priceHi - 50000); pLo.value = state.priceLo; later(); });
  pHi.addEventListener("input", () => { state.priceHi = Math.max(Number(pHi.value), state.priceLo + 50000); pHi.value = state.priceHi; later(); });
  const nbSel = document.getElementById("nb");
  nbSel.append(el("option", { value: "" }, `All ${NB.length}`)); NB.forEach((n, i) => nbSel.append(el("option", { value: String(i) }, n.name)));
  nbSel.value = state.mapNb;
  nbSel.addEventListener("change", () => { state.mapNb = nbSel.value; save(); history.replaceState(null, "", state.mapNb === "" ? "#" : "#n=" + slug(NB[+state.mapNb].name)); update(); fitToSelection(); });
  const sortSel = document.getElementById("sort"); sortSel.value = state.mapSort;
  sortSel.addEventListener("change", () => { state.mapSort = sortSel.value; save(); shown = PAGE; renderList(); });
  document.getElementById("toggleView").addEventListener("click", () => { document.body.classList.toggle("showmap"); document.getElementById("toggleView").textContent = document.body.classList.contains("showmap") ? "List" : "Map"; if (document.body.classList.contains("showmap")) map.resize(); });
  paintSliders();
  document.getElementById("filtBtn").addEventListener("click", e => { const open = document.body.classList.toggle("filtopen"); e.currentTarget.setAttribute("aria-expanded", String(open)); e.currentTarget.textContent = open ? "Done" : "Filters"; setTimeout(() => map.resize(), 0); });

  // ---------- homes (one per parcel, at its latest qualifying sale)
  let homes = [];
  function computeHomes() {
    homes = [];
    for (const [pid, list] of byHome) { const s = list.find(eligible); if (s) homes.push({ pid, s, n: list.length, k: colorClass(s) }); }
  }
  const geo = () => ({ type: "FeatureCollection", features: homes.map(h => ({ type: "Feature", id: h.pid, geometry: { type: "Point", coordinates: [h.s.lon, h.s.lat] }, properties: { pid: h.pid, k: h.k } })) });

  // ---------- map
  const BLANK = { version: 8, sources: {}, layers: [{ id: "bg", type: "background", paint: { "background-color": dark() ? "#1d1d1c" : "#eeede9" } }] };
  const SAT = { version: 8, sources: { sat: { type: "raster", tiles: ["https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}"], tileSize: 256, maxzoom: 19, attribution: "Imagery © Esri, Maxar, Earthstar Geographics" } }, layers: [{ id: "sat", type: "raster", source: "sat" }] };
  const styleUrl = () => state.mapBase === "sat" ? SAT : dark() ? "https://basemaps.cartocdn.com/gl/dark-matter-gl-style/style.json" : "https://basemaps.cartocdn.com/gl/voyager-gl-style/style.json";
  const map = new maplibregl.Map({ container: "map", style: styleUrl(), center: [-104.975, 39.725], zoom: 12, attributionControl: { compact: true }, customAttribution: "Sales: City and County of Denver open data" });
  map.addControl(new maplibregl.NavigationControl({ showCompass: false }), "top-right");
  let styleFailed = false;
  map.on("error", e => { console.error(e?.error || e); if (!styleFailed && !map.isStyleLoaded() && String(e?.error?.message || "").match(/style|fetch|Failed/i)) { styleFailed = true; map.setStyle(BLANK); } });
  function setBase() { styleFailed = false; document.getElementById("map").classList.toggle("sat", state.mapBase === "sat"); map.setStyle(styleUrl()); }
  document.getElementById("map").classList.toggle("sat", state.mapBase === "sat");
  document.getElementById("map").classList.toggle("dark", dark());

  function addLayers() {
    const ramp = RAMP();
    if (bounds && !map.getSource("nb")) {
      map.addSource("nb", { type: "geojson", data: bounds });
      map.addLayer({ id: "nb-fill", type: "fill", source: "nb", paint: { "fill-color": state.mapBase === "sat" ? "#ffffff" : "#2a78d6", "fill-opacity": 0.03 } });
      map.addLayer({ id: "nb-line", type: "line", source: "nb", paint: { "line-color": state.mapBase === "sat" ? "#ffffff" : dark() ? "#9ec5f4" : "#1c5cab", "line-width": ["interpolate", ["linear"], ["zoom"], 11, 1, 15, 2], "line-opacity": 0.55, "line-dasharray": [3, 2] } });
    }
    if (!map.getSource("homes")) {
      map.addSource("homes", { type: "geojson", data: geo(), promoteId: "pid" });
      map.addLayer({ id: "dots", type: "circle", source: "homes",
        paint: {
          "circle-color": ["match", ["get", "k"], 0, ramp[0], 1, ramp[1], 2, ramp[2], 3, ramp[3], ramp[4]],
          "circle-radius": ["interpolate", ["linear"], ["zoom"], 10, 2, 12, 3, 14, 5.5, 16, 8],
          "circle-stroke-color": ["case", ["boolean", ["feature-state", "hl"], false], css("--hl"), "#ffffff"],
          "circle-stroke-width": ["interpolate", ["linear"], ["zoom"], 10, ["case", ["boolean", ["feature-state", "hl"], false], 3, 0.3], 14, ["case", ["boolean", ["feature-state", "hl"], false], 3, 1.2]],
          "circle-opacity": ["interpolate", ["linear"], ["zoom"], PIN_ZOOM - 0.01, 0.95, PIN_ZOOM, 0],
          "circle-stroke-opacity": ["interpolate", ["linear"], ["zoom"], PIN_ZOOM - 0.01, 1, PIN_ZOOM, 0],
        } });
      map.on("mouseenter", "dots", () => map.getCanvas().style.cursor = "pointer");
      map.on("mouseleave", "dots", () => { map.getCanvas().style.cursor = ""; setHl(null); });
      map.on("mousemove", "dots", e => { const f = e.features[0]; if (f) setHl(f.properties.pid, true); });
      map.on("click", "dots", e => { const f = e.features[0]; if (f) openPopup(f.properties.pid); });
    }
    placeNbLabels(); syncPins();
  }
  map.on("style.load", addLayers);

  // neighborhood labels (HTML so they don't depend on basemap fonts)
  let nbMarkers = [];
  function placeNbLabels() {
    nbMarkers.forEach(m => m.remove()); nbMarkers = [];
    if (!bounds) return;
    for (const f of bounds.features) {
      const c = f.properties.label || centroid(f.geometry); const d = el("div", { class: "nblabel" }, f.properties.name);
      nbMarkers.push(new maplibregl.Marker({ element: d }).setLngLat(c).addTo(map));
    }
    toggleNbLabels();
  }
  function toggleNbLabels() { const z = map.getZoom(), show = z < PIN_ZOOM && (z >= 12.4 || state.mapNb !== ""); nbMarkers.forEach(m => m.getElement().style.display = show ? "" : "none"); }
  function centroid(g) {
    const ring = g.type === "Polygon" ? g.coordinates[0] : g.coordinates.reduce((a, p) => p[0].length > a.length ? p[0] : a, []);
    let x = 0, y = 0; ring.forEach(([a, b]) => { x += a; y += b; }); return [x / ring.length, y / ring.length];
  }

  // price pins when zoomed in
  const pinMarkers = new Map();
  function syncPins() {
    const zoomed = map.getZoom() >= PIN_ZOOM;
    const b = map.getBounds();
    const want = zoomed ? homes.filter(h => b.contains([h.s.lon, h.s.lat])).slice(0, MAX_PINS) : [];
    const keep = new Set(want.map(h => h.pid));
    for (const [pid, m] of pinMarkers) if (!keep.has(pid)) { m.remove(); pinMarkers.delete(pid); }
    const ramp = RAMP();
    for (const h of want) {
      let m = pinMarkers.get(h.pid);
      if (!m) {
        const d = el("div", { class: "pin num", role: "button", tabindex: "0", "aria-label": `${h.s.addr}, sold ${fmt$(h.s.price)}` });
        d.addEventListener("click", e => { e.stopPropagation(); openPopup(h.pid); });
        d.addEventListener("keydown", e => { if (e.key === "Enter") openPopup(h.pid); });
        d.addEventListener("mouseenter", () => setHl(h.pid, true)); d.addEventListener("mouseleave", () => setHl(null));
        m = new maplibregl.Marker({ element: d, anchor: "bottom" }).setLngLat([h.s.lon, h.s.lat]).addTo(map); pinMarkers.set(h.pid, m);
      }
      const d = m.getElement(); d.textContent = pinK(h.s.price); d.style.background = ramp[h.k]; d.classList.toggle("light", lightText(h.k));
    }
    toggleNbLabels();
  }

  // hover sync between pins and cards
  let hlPid = null;
  function setHl(pid, fromMap) {
    if (hlPid === pid) return;
    if (hlPid != null) { if (map.getSource("homes")) map.setFeatureState({ source: "homes", id: hlPid }, { hl: false }); pinMarkers.get(hlPid)?.getElement().classList.remove("hl"); document.querySelector(`.card[data-pid="${hlPid}"]`)?.classList.remove("hl"); }
    hlPid = pid;
    if (pid != null) {
      if (map.getSource("homes")) map.setFeatureState({ source: "homes", id: pid }, { hl: true });
      pinMarkers.get(pid)?.getElement().classList.add("hl");
      const card = document.querySelector(`.card[data-pid="${pid}"]`); card?.classList.add("hl");
    }
  }

  // popup
  let popup = null;
  function openPopup(pid, fly) {
    const h = homes.find(x => x.pid === pid); if (!h) return;
    const s = h.s, list = byHome.get(pid);
    const box = el("div", { class: "pop" });
    box.append(el("div", { class: "d" }, `Sold ${fmtD(s.date)} · ${NB[s.nb].name}`), el("div", { class: "p num" }, fmt$(s.price)));
    const facts = [s.beds != null ? `${s.beds} bd` : null, s.baths != null ? `${s.baths} ba` : null, `${s.sqft.toLocaleString()} sq ft`].filter(Boolean).join("  ·  ");
    box.append(el("div", { class: "facts" }, facts), el("div", { class: "addr" }, `${s.addr}, Denver, CO ${s.zip}`));
    const dl = el("dl");
    for (const [k, v] of [["$ / sq ft", fmt$(s.price / s.sqft)], ["Built", String(s.yb)], ["Lot", s.lot ? s.lot.toLocaleString() + " sq ft" : "–"], ["Zoning", s.zone || "–"]]) { dl.append(el("dt", {}, k), el("dd", { class: "num" }, v)); }
    box.append(dl);
    if (list.length > 1) {
      box.append(el("h4", {}, "Sale history"));
      const tb = el("table");
      list.forEach((x, i) => {
        const tr = el("tr"); tr.append(el("td", {}, fmtD(x.date)), el("td", { class: "r num" }, fmt$(x.price)));
        const prev = list[i + 1]; const ch = prev ? x.price / prev.price - 1 : null;
        tr.append(el("td", { class: "r num " + (ch > 0 ? "up" : ch < 0 ? "down" : "") }, ch == null ? "" : (ch > 0 ? "+" : "") + (ch * 100).toFixed(0) + "%"));
        tb.append(tr);
      });
      box.append(tb);
    }
    box.append(el("a", { class: "z", href: zillow(s), target: "_blank", rel: "noopener" }, "View on Zillow ↗"));
    popup?.remove();
    popup = new maplibregl.Popup({ offset: map.getZoom() >= PIN_ZOOM ? 28 : 10, maxWidth: "340px", focusAfterOpen: false }).setLngLat([s.lon, s.lat]).setDOMContent(box).addTo(map);
    if (fly) map.flyTo({ center: [s.lon, s.lat], zoom: Math.max(map.getZoom(), 16), speed: 1.6 });
  }

  // list
  let shown = PAGE;
  function inView() { const b = map.getBounds(); return homes.filter(h => b.contains([h.s.lon, h.s.lat])); }
  function renderList() {
    const list = document.getElementById("list"); list.replaceChildren();
    const rows = inView();
    const key = { new: h => h.s.date, hi: h => h.s.price, lo: h => -h.s.price, ppsf: h => h.s.price / h.s.sqft, size: h => h.s.sqft }[state.mapSort];
    rows.sort((a, b) => { const A = key(a), B = key(b); return A < B ? 1 : A > B ? -1 : 0; });
    document.getElementById("listTitle").textContent = `${rows.length.toLocaleString()} homes in view`;
    document.getElementById("listSub").textContent = `One per home at its latest sale · ${homes.length.toLocaleString()} match filters`;
    document.getElementById("count").textContent = `${homes.length.toLocaleString()} homes · ${rows.length.toLocaleString()} in view`;
    if (!rows.length) { list.append(el("p", { class: "empty" }, "No sales in this part of the map with these filters. Zoom out or widen the filters.")); return; }
    const ramp = RAMP();
    for (const h of rows.slice(0, shown)) {
      const s = h.s, c = el("div", { class: "card", "data-pid": h.pid, tabindex: "0", role: "button" });
      const bar = el("div", { class: "bar" }); bar.style.background = ramp[h.k];
      const price = el("div", { class: "price num" }, fmt$(s.price)); price.append(el("small", {}, `Sold ${fmtD(s.date)}`));
      const facts = el("div", { class: "facts num" });
      const bits = []; if (s.beds != null) bits.push([s.beds, " bd"]); if (s.baths != null) bits.push([s.baths, " ba"]); bits.push([s.sqft.toLocaleString(), " sq ft"]);
      bits.forEach(([v, u], i) => { if (i) facts.append(el("span", { class: "sep" }, "|")); facts.append(el("b", {}, String(v)), document.createTextNode(u)); });
      const meta = `${NB[s.nb].name} · built ${s.yb}${h.n > 1 ? ` · sold ${h.n}× since 2015` : ""}`;
      c.append(bar, price, facts, el("div", { class: "addr" }, s.addr), el("div", { class: "meta" }, meta));
      c.addEventListener("mouseenter", () => setHl(h.pid)); c.addEventListener("mouseleave", () => setHl(null));
      const go = () => { if (matchMedia("(max-width: 820px)").matches) { document.body.classList.add("showmap"); document.getElementById("toggleView").textContent = "List"; map.resize(); } openPopup(h.pid, true); };
      c.addEventListener("click", go); c.addEventListener("keydown", e => { if (e.key === "Enter") go(); });
      list.append(c);
    }
    if (rows.length > shown) { const d = el("div", { class: "more" }); const b = el("button", { class: "btn" }, `Show more (${(rows.length - shown).toLocaleString()} left)`); b.addEventListener("click", () => { shown += PAGE; renderList(); }); d.append(b); list.append(d); }
  }

  function renderLegend() {
    const lg = document.getElementById("legend"); lg.replaceChildren(el("div", { class: "title" }, state.mapColor === "age" ? "Sold" : "Sale price"));
    const ramp = RAMP();
    const items = state.mapColor === "age" ? AGE_LABELS.map((l, i) => [l, [4, 3, 1, 0][i]]) : PRICE_LABELS.map((l, i) => [l, i]);
    for (const [label, k] of items) { const r = el("div", { class: "row" }); const i = el("i"); i.style.background = ramp[k]; r.append(i, document.createTextNode(label)); lg.append(r); }
  }

  function update() {
    computeHomes(); renderLegend();
    const src = map.getSource("homes"); if (src) src.setData(geo());
    popup?.remove(); shown = PAGE; syncPins(); renderList();
  }
  function fitToSelection() {
    if (state.mapNb !== "" && bounds) {
      const f = bounds.features.find(f => f.properties.name === NB[+state.mapNb].name);
      if (f) { const pts = (f.geometry.type === "Polygon" ? f.geometry.coordinates : f.geometry.coordinates.flat()).flat(); fit(pts); return; }
    }
    if (homes.length) fit(homes.map(h => [h.s.lon, h.s.lat]));
  }
  function fit(pts) {
    let a = [180, 90, -180, -90]; for (const [x, y] of pts) { a = [Math.min(a[0], x), Math.min(a[1], y), Math.max(a[2], x), Math.max(a[3], y)]; }
    map.fitBounds([[a[0], a[1]], [a[2], a[3]]], { padding: 40, duration: 600, maxZoom: 16 });
  }
  let mt; map.on("moveend", () => { clearTimeout(mt); mt = setTimeout(() => { syncPins(); shown = PAGE; renderList(); }, 60); });
  map.on("zoom", toggleNbLabels);
  matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => { document.getElementById("map").classList.toggle("dark", dark()); if (state.mapBase === "map") setBase(); update(); paintSliders(); });

  computeHomes(); renderLegend();
  map.once("load", () => { fitToSelection(); renderList(); });
  renderList();
})();
</script>
</body>
</html>
