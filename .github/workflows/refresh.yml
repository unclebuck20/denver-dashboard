name: Weekly data refresh

# Pulls Denver open data, rebuilds docs/data.json, and commits it; GitHub Pages then republishes docs/.
# Also runs whenever pipeline code or the pages change, so every code push is tested against live data.
on:
  schedule:
    - cron: "0 13 * * 1"   # Mondays 13:00 UTC = 6am Pacific (5am in winter)
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["scripts/**", "requirements.txt", "docs/index.html", "docs/map.html", "docs/js/**", ".github/workflows/**"]

permissions:
  contents: write

# Never let two refreshes race each other's commits.
concurrency:
  group: data-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Fetch Denver open data
        run: python scripts/fetch.py
      - name: Clean and build dashboard data
        run: python scripts/build.py
      - name: Commit updated data
        run: |
          git config user.name "data-bot"
          git config user.email "data-bot@users.noreply.github.com"
          git add data/ docs/
          if git diff --cached --quiet; then echo "No data changes"; exit 0; fi
          git commit -m "Data refresh $(date -u +%F)"
          git pull --rebase origin main
          git push
